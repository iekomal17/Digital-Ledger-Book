{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Add Transaction</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body class="dashboard-body">

<div class="navbar">
    <h2>💰 Add Transaction</h2>
</div>

<div class="form-container">
    <div class="form-card">

        <h2>{{ customer.name }}</h2>
        <p class="form-subtitle">Add new ledger entry</p>

        <form method="post">
            {% csrf_token %}

            <div class="input-group">
                {{ form.transaction_type.label_tag }}
                {{ form.transaction_type }}
            </div>

            <div class="input-group">
                {{ form.amount.label_tag }}
                {{ form.amount }}
            </div>

            <div class="input-group">
                {{ form.description.label_tag }}
                {{ form.description }}
            </div>

            <button type="submit" class="primary-btn">
                Save Transaction
            </button>
        </form>

        <br>
        <a href="{% url 'customer_ledger' customer.id %}" class="nav-btn">
            ← Back to Ledger
        </a>

    </div>
</div>

</body>
</html>
